# Model Configuration
# Industrial PCB Defect Detection
# Owner: Heba (Model Training & Evaluation)

model:
  architecture: YOLO11n
  task: object_detection
  pretrained: true            # transfer learning from COCO-pretrained weights
  image_size: 320
  num_classes: 6

classes:
  0: mouse_bite
  1: spur
  2: missing_hole
  3: short
  4: open_circuit
  5: spurious_copper

dataset:
  source: dataset_final/            # handed off by Aya
  data_yaml: dataset_final/data.yaml
  train_images: 8534
  val_images: 1060
  test_images: 1063

training:
  epochs: 30
  batch_size: 4
  optimizer: auto
  learning_rate: 0.01
  learning_rate_final_factor: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  patience: 8
  warmup_epochs: 3.0
  device: "0"
  seed: 0
  deterministic: true
  amp: true
  workers: 0
  augmentation:
    hsv_h: 0.015
    hsv_s: 0.7
    hsv_v: 0.4
    translate: 0.1
    scale: 0.5
    fliplr: 0.5
    mosaic: 1.0
    close_mosaic: 10

weights:
  final_model: best.pt

# Values above were extracted from the `train_args` embedded in `best.pt`
# (Ultralytics 8.4.147). `optimizer: auto` is the exact recorded value; the
# checkpoint does not record which concrete optimizer Auto selected.
